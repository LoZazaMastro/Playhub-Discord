name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '9.4.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: node --test tests/*.cjs
      - run: pnpm build

  windows-runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -B -m unittest discover -s tests -p 'test_windows*.py'
      - run: python -B -m unittest discover -s tests -p test_bridge_endpoint.py
