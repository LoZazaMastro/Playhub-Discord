name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check source and bundled runtime for embedded credentials
        run: python -B scripts/check-secrets.py
      - name: Verify credential scanning of runtime and source archives
        run: python -B -m unittest discover -s tests -p test_secret_payload.py
      - uses: pnpm/action-setup@v4
        with:
          version: '9.4.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: node --test tests/*.cjs
      - run: pnpm build

  windows-runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -B -m unittest discover -s tests -p 'test_windows*.py'
      - run: python -B -m unittest discover -s tests -p test_bridge_endpoint.py
      - name: Verify the private runtime scan guard
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'Vesktop-1.6.8-win.zip'
          Invoke-WebRequest -Uri 'https://github.com/Vencord/Vesktop/releases/download/v1.6.8/Vesktop-1.6.8-win.zip' -OutFile $archive
          python -X utf8 -B scripts/derive-vesktop.py --base $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --experimental-vm-modules tests/test-arrpc-scan-guard.mjs
